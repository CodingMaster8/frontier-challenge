name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔍 Running automated checks on your PR...'
            })

  changed-files:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      python_changed: ${{ steps.filter.outputs.python }}
      docs_changed: ${{ steps.filter.outputs.docs }}
      tests_changed: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'frontier_challenge/**/*.py'
              - 'tests/**/*.py'
              - 'requirements.txt'
              - 'pyproject.toml'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - '**.md'
            tests:
              - 'tests/**/*.py'

  lint-pr:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: changed-files
    if: needs.changed-files.outputs.python_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system ruff mypy
          uv pip install --system -r requirements.txt

      - name: Run Ruff
        run: |
          ruff format --check . --diff
          ruff check . --output-format=github

      - name: Run MyPy
        run: mypy frontier_challenge/ --no-error-summary
        continue-on-error: true

  test-pr:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: changed-files
    if: needs.changed-files.outputs.python_changed == 'true' || needs.changed-files.outputs.tests_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-cov

      - name: Create .env file
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}" >> .env
          echo "PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}" >> .env
          echo "DATABASE_PATH=data/br_funds.db" >> .env

      - name: Run tests (excluding DB-dependent tests)
        run: |
          pytest tests/test_download.py -v --cov=frontier_challenge/ --cov-report=term-missing --cov-report=html
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        continue-on-error: false

      - name: Skip DB tests (info)
        run: |
          echo "ℹ️ Skipping database-dependent tests in CI:"
          echo "  - test_sql_tool_simple.py"
          echo "  - test_holdings_tool.py"
          echo "  - test_cnpj_tool.py"
          echo "  - test_semantic_tool.py"
          echo "These tests require the full database (1.5GB) which is not available in CI."

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      - name: Comment PR with coverage
        if: always()
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  docs-pr:
    name: Documentation Check
    runs-on: ubuntu-latest
    needs: changed-files
    if: needs.changed-files.outputs.docs_changed == 'true' || needs.changed-files.outputs.python_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          uv pip install --system mkdocs-material mkdocstrings[python]

      - name: Build documentation
        run: mkdocs build --strict

  size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          FILES_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l)
          LINES_CHANGED=$(git diff --stat origin/${{ github.base_ref }}...HEAD | tail -1 | awk '{print $4}' | sed 's/[^0-9]*//g')

          echo "Files changed: $FILES_CHANGED"
          echo "Lines changed: $LINES_CHANGED"

          if [ "$FILES_CHANGED" -gt 50 ]; then
            echo "⚠️ Warning: This PR changes $FILES_CHANGED files. Consider breaking it into smaller PRs."
          fi

          if [ "$LINES_CHANGED" -gt 1000 ]; then
            echo "⚠️ Warning: This PR changes $LINES_CHANGED lines. Consider breaking it into smaller PRs."
          fi

  pr-checks-complete:
    name: All PR Checks Passed
    runs-on: ubuntu-latest
    needs: [lint-pr, test-pr, docs-pr]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint-pr.result }}" == "failure" ] || \
             [ "${{ needs.test-pr.result }}" == "failure" ] || \
             [ "${{ needs.docs-pr.result }}" == "failure" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "✅ All PR checks passed!"

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All automated checks passed! Your PR is ready for review.'
            })
